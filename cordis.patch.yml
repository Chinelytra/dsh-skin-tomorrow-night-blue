# The dsh-skin-tomorrow-night-blue bundle patch: mounts the host half.
#
# A bundle contributes rows to the profile through its own patch file, named by
# `dsh.bundle.patch` in package.json. `name` is a package specifier, not a
# path: the loader resolves it against the profile's node_modules.
- insert:
    - id: skin-tomorrow-night-blue
      name: 'dsh-skin-tomorrow-night-blue'
