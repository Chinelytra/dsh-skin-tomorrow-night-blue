name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the committed bundle matches the palette source
        run: |
          node build-client.mjs
          git diff --exit-code -- lib/client.js
      - name: Offline verification
        run: node verify.mjs
